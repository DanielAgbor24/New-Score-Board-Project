<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Lora:ital,wght@0,400..700;1,400..700&family=Orbitron:wght@400..900&family=Oxanium:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    </head>
    <body>
        <div id="score-board">
        <div class="container">
            <div>
                <h3>HOME</h3>
                <div id="home-score">0</div>
                <div id="score-increment">
                    <button class="btn" onclick="plusOneHome()">+1</button>
                    <button class="btn" onclick="plusTwoHome()">+2</button>
                    <button class="btn" onclick="plusThreeHome()">+3</button>
                </div>
            </div>
            <div>
                <h3>GUEST</h3>
                <div id="guest-score">0</div>
                <div id="score-increment">
                    <button class="btn" onclick="plusOneGuest()">+1</button>
                    <button class="btn" onclick="plusTwoGuest()">+2</button>
                    <button class="btn" onclick="plusThreeGuest()">+3</button>
                </div>
            </div>
        </div>
        <div id="reset">
            <button class="reset-btn" onclick="reset()">Reset</button>
        </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
